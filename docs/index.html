</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const colors = [
	"neon-pink", "cyber-yellow", "venom-green", 
    "ocean-glance", "toxic-orange", "laser-lemon", "plasma-purple",
    "deep-space", "midnight-ash", "obsidian", "vampire-red", 
    "gunmetal", "cloud-soft", "mint-sorbet", "lavender-mist", 
    "peach-fuzz", "baby-blue", "rose-quartz", "royal-velvet", 
    "emerald-city", "sapphire-blue", "slate-gray", "crimson-tide", 
    "gold-leaf", "ultramarine", "coral-punch", "teal-dream", 
    "arctic-white", "coffee-bean", "acid-lime", "electric-indigo", "digital-cyan", "infra-red", "plasma-beam",
    "desert-sand", "forest-edge", "burnt-sienna", "olive-drab", "ocean-abyss",
    "rose-gold", "silver-fox", "bronze-statue", "platinum", "champagne",
    "bubblegum", "wild-berry", "arctic-lime", "sunset-glow", "slate-blue"
];

const gallery = document.getElementById('color-gallery');

colors.forEach(color => {
    const col = document.createElement('div');
    col.className = 'col-md-4 col-lg-3';
    
    col.innerHTML = `
        <div class="card shadow-sm border-${color}">
            <div class="card-body bg-${color} rounded-top shadow-inner" style="height: 100px;">
            </div>
            <div class="card-body">
                <h6 class="text-capitalize mb-2">${color.replace(/-/g, ' ')}</h6>
                <code class="d-block mb-3 small">.bg-${color}<br>.text-${color}<br>.border-${color}<br>.btn-${color}</code>
                <button class="btn btn-${color} btn-sm w-100">Test Button</button>
            </div>
        </div>
    `;
    gallery.appendChild(col);
});
</script>
